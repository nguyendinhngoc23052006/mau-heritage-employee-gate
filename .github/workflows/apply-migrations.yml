name: apply-migrations

# Auto-applies any new supabase/migrations/*.sql files to the production DB
# when they land on main. Free-tier substitute for Supabase Branching's
# built-in migration hook — replaces the "paste into SQL Editor" manual step.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
      - ".github/workflows/apply-migrations.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI. `latest` hits GitHub's anon rate limit on shared
          # runner IPs. `2.20.5` was too old — didn't recognize newer
          # config.toml keys (db.health_timeout, db.migrations.enabled,
          # experimental.pgdelta, storage.analytics, storage.s3_protocol,
          # storage.vector, db.network_restrictions). Bumped to a version
          # recent enough to accept all of them.
          version: 2.30.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link project + repair ghost history + push new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # Legacy: someone ran `supabase migration new` locally at these timestamps
          # but never committed the files, leaving orphan rows in supabase_migrations.schema_migrations
          # that `db push` refuses to reconcile. Mark them reverted so push proceeds.
          # `|| true` because once repaired, subsequent runs no-op harmlessly.
          supabase migration repair --linked \
            --status reverted \
            20260817072203 20260817072235 20260817072322 \
            20260817113820 20260817121342 \
            20260818131500 20260818131542 \
            20260821204255 \
            || true
          supabase db push --linked
