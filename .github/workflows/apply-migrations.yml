name: apply-migrations

# Applies any new supabase/migrations/*.sql to the production DB when they
# land on main. This is the ONLY way schema reaches production — nothing is
# applied by hand. See the Migrations section of CLAUDE.md.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
      - ".github/workflows/apply-migrations.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          # Pinned: `latest` resolves via an unauthenticated GitHub API call
          # that hits the anon rate limit on shared runner IPs.
          version: 2.48.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # supabase/config.toml carries keys no pinned CLI parses, and the
          # CLI's parser is strict enough to abort before running anything.
          # `db push` only needs project_id, so swap in a minimal stub — the
          # checkout is ephemeral and the committed file is untouched.
          mv supabase/config.toml supabase/config.toml.original
          printf 'project_id = "%s"\n' "$SUPABASE_PROJECT_REF" > supabase/config.toml

          # `link` intermittently fails against Supabase's management API with
          # "Failed to get API keys for project" and succeeds on a retry with
          # the same token. Retry here rather than leave a migration unapplied
          # until a human notices the red run.
          for attempt in 1 2 3; do
            supabase link --project-ref "$SUPABASE_PROJECT_REF" && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::supabase link failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

          supabase db push --linked
